implementation_notes:
  ui_components:
    - RepositorySelectionDialog: Full-featured selection dialog
      * Checkbox list of available repositories
      * Smart default selection (primary or all)
      * Workspace preparation summary card
      * Progress indicator during generation
      * Error display for failed repositories
    - TaskDetailView: Enhanced with progress display
      * Shows workspace generation progress messages
      * Progress card with spinner during cloning
  backend_components:
    - TasksViewModel: Extended with repository selection
      * showRepositorySelectionDialog() - Opens selection dialog
      * hideRepositorySelectionDialog() - Closes dialog
      * generateWorkspace() - Accepts selected repository IDs
      * Default selection logic (primary or all)
  validation_rules:
    - At least one repository must be selected
    - Selected repositories must exist in project
    - Workspace generation disabled during active generation
  default_selection_logic:
    - If primary repository exists: select only primary
    - If no primary exists: select all repositories
    - If no repositories exist: show error message
  error_handling:
    - Partial failures: Detailed error messages list failed and successful repositories
    - Failed repositories marked with error message in workspace metadata
    - Workspace status set to FAILED if any repository fails
    - Error message includes: failed repo names with errors, successful repo names, workspace path
    - User can see exactly which repositories cloned successfully and which failed
