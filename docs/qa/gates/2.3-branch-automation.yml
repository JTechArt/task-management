implementation_notes:
  core_components:
    - BranchTemplateExpander: Utility for expanding branch templates
      * Supports 6 placeholders: taskId, taskIdShort, taskTitle, taskType, date, timestamp
      * Sanitizes branch names (lowercase, no special chars, max 50 chars)
      * Validates templates for correctness
    - FileSystemWorkspaceService: Enhanced with branch creation
      * Expands branch template during workspace creation
      * Creates and checks out branch after cloning
      * Handles branch creation failures gracefully
    - GenerateWorkspaceUseCase: Updates task with branch name
      * Stores generated branch name in task entity
      * Branch name available for all repositories in workspace
    - GitService: Added remote repository validation
      * validateRemoteRepository() method for pre-clone validation
      * Returns RepositoryInfo with accessibility status
      * Supports HTTPS and TOKEN authentication
  branch_template_placeholders:
    - "{taskId}": Full task UUID
    - "{taskIdShort}": First 8 characters of UUID
    - "{taskTitle}": Sanitized task title
    - "{taskType}": Task type (lowercase)
    - "{date}": Creation date (YYYY-MM-DD)
    - "{timestamp}": Unix timestamp
  branch_name_sanitization:
    - Converts to lowercase
    - Replaces spaces with hyphens
    - Removes special characters (keeps hyphens and underscores)
    - Removes consecutive hyphens
    - Trims hyphens from edges
    - Limits length to 50 characters
  error_handling:
    - Branch creation failures logged but don't block workspace
    - Repository validation failures prevent cloning
    - Clear error messages for troubleshooting
    - Workspace remains usable even if branch creation fails
