top_issues:
  - id: REQ-001
    severity: high
    finding: "No UI to launch IDE; user cannot trigger launch from task. TasksView is placeholder; no task detail or launch action."
    suggested_action: "Implement task detail view with 'Launch IDE' action; add IDE selector (filtered by repo preferredIDEs); wire to LaunchIDEUseCase."
    status: RESOLVED
    resolution: "TaskDetailView includes IDE launch buttons filtered by preferred IDEs. Wired to LaunchIDEUseCase via TasksViewModel."
  - id: REQ-002
    severity: high
    finding: "LaunchIDEUseCase not wired to desktop app; no DI or viewmodels for IDE launch flow."
    suggested_action: "Wire LaunchIDEUseCase, IDEService, ActivityRepository to desktop-app; add DI/bootstrap."
    status: RESOLVED
    resolution: "DependencyContainer includes LaunchIDEUseCase, IDEService, and ActivityRepository. TasksViewModel handles IDE launch."
  - id: REQ-003
    severity: medium
    finding: "AC2: Backend validates preferred IDEs but allows unconfigured IDE (logs warning). UI should filter and only present configured IDEs."
    suggested_action: "When building IDE selector UI, filter options by repository.preferredIDEs; backend already supports validation."
    status: RESOLVED
    resolution: "UI filters available IDEs by preferredIDEs list. Only configured and installed IDEs shown to user."
  - id: REL-001
    severity: low
    finding: "InMemoryActivityRepository does not persist activity across app restarts."
    suggested_action: "Consider persistent ActivityRepository (DB) for audit trail; acceptable for MVP."
    status: ACCEPTED
    resolution: "Acceptable for MVP. Defer to later when audit requirements increase."
