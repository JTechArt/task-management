schema: 1
story: "5.1"
story_title: "Pre-Run Script Configuration and Execution"
gate: PASS
status_reason: "All ACs met. Pre-run scripts integrated into IDE launch flow with activity logging, configuration UI, and execution order. Path traversal fix applied during review. INLINE_COMMAND and requiredValue usage documented as known risks."
