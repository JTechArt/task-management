waiver: { active: false }
top_issues:
  - id: SEC-001
    severity: medium
    finding: "SCRIPT_PATH allowed path traversal (relative paths could escape workspace)"
    suggested_action: "Validate resolved script path is within workspace directory"
    status: RESOLVED
    resolution: "Added isPathWithinWorkspace() check; rejects absolute paths outside workspace and relative paths with .."
  - id: MNT-001
    severity: low
    finding: "INLINE_COMMAND passes user input to bash -lc (inherent command-injection surface)"
    suggested_action: "Document as accepted risk; consider UI warning for power users"
    status: ACCEPTED
    resolution: "By design per AC; add UI hint in future sprint if needed"
  - id: MNT-002
    severity: low
    finding: "requiredValue interpolated into shell commands (NODE/JAVA/PYTHON/ENV)"
    suggested_action: "Consider allowlist validation for version/env-var identifiers"
    status: ACCEPTED
    resolution: "grep -F used for most; acceptable for MVP; strengthen in future if needed"

